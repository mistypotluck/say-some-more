<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Say Some More • 20-Second Attention Translator</title>
    <meta name="description" content="AI Companion translating elderly Singlish stories into 20-second actionable capsules for busy family members." />
    <script>
      // Defensive setter for window.fetch in case runtime or extensions attempt reassignment
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback if property is not redefinable
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f0ede8] text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
